services:
  - type: web
    name: chat-docs-api
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: RENDER
        value: "true"
    disk:
      enabled: true
      mountPath: /app/data
      sizeGB: 1

  - type: web
    name: chat-docs-web
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://chat-with-documents-1chi.onrender.com/api/v1
      - key: NEXT_PUBLIC_WS_URL
        value: wss://chat-with-documents-1chi.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://chat-docs-web.onrender.com